# AGP requires this to be stated explicitly, and fails the build without it —
# every androidx dependency in the graph gets reported as an error rather than
# one message about the missing flag, which makes the cause hard to see in a log.
android.useAndroidX=true
# Nothing here uses a pre-AndroidX library, so there is nothing to rewrite.
android.enableJetifier=false

# The default heap is not enough for AGP plus the Kotlin compiler on a CI runner.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official
