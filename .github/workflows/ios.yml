name: iOS

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned .ipa
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      # Runs the same checks available locally, so a mistake that could have
      # been caught without a Mac fails in seconds rather than minutes.
      - name: Static checks
        run: |
          python3 -m pip install --quiet pyyaml || true
          python3 pol-reader/tools/precheck.py

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      # No certificates and no secrets: the build is deliberately unsigned so a
      # fresh clone with zero configuration still produces an artifact. Signing
      # happens externally.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project pol-reader/ios/PolReader.xcodeproj \
            -scheme PolReader \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Package
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/PolReader.app"
          if [ ! -d "$APP" ]; then
            echo "::error::$APP was not produced by the build"
            find build/Build/Products -maxdepth 3 -name '*.app' || true
            exit 1
          fi
          rm -rf payload
          mkdir -p payload/Payload
          cp -R "$APP" payload/Payload/
          (cd payload && ditto -c -k --sequesterRsrc --keepParent Payload ../PolReader-unsigned.ipa)

          # Verify the artifact rather than trusting that the step succeeded.
          ls -l PolReader-unsigned.ipa
          shasum -a 256 PolReader-unsigned.ipa
          unzip -l PolReader-unsigned.ipa | head -20

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PolReader-unsigned-ipa
          path: PolReader-unsigned.ipa
          if-no-files-found: error

      # A release asset is a bare file at a stable URL. A workflow artifact is
      # wrapped in a second zip and cannot be downloaded from the GitHub mobile
      # app at all, so the release is the one that is actually installable.
      - name: Publish to rolling release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=latest
          # Three workflows share this one release, so the notes are set on
          # every publish rather than only at creation — otherwise whichever
          # workflow happened to run first describes all of the assets.
          NOTES="Rolling builds of everything in this repo. The .ipa files are unsigned; sign before installing. The .apk is debug-signed."
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Latest build" --notes "$NOTES" --latest || true
          gh release edit "$TAG" --notes "$NOTES" >/dev/null
          gh release upload "$TAG" PolReader-unsigned.ipa --clobber

          # Confirm against the API that the asset actually changed, rather
          # than inferring it from a green step.
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "\(.name) \(.size) bytes updated \(.updatedAt)"'
