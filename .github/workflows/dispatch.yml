name: Dispatch

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'dispatch/**'
      - '.github/workflows/dispatch.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dispatch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned .ipa
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      # The same checks available locally, so a mistake that could have been
      # caught without a Mac fails in seconds rather than minutes. This also
      # runs the parser tests, which are where the real behaviour lives.
      - name: Static checks and parser tests
        run: |
          python3 -m pip install --quiet pyyaml || true
          python3 dispatch/tools/precheck.py

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      # No certificates and no secrets: deliberately unsigned so a fresh clone
      # with zero configuration still produces an artifact.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project dispatch/ios/Dispatch.xcodeproj \
            -scheme Dispatch \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

          # Every build used to call itself 1.0 (1), which made "is the fix on
          # your phone" unanswerable — days of debugging happened against an
          # install nobody could date. The run number in Settings > About ends
          # that: the release page and the phone can be compared at a glance.

      - name: Package
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/Dispatch.app"
          if [ ! -d "$APP" ]; then
            echo "::error::$APP was not produced by the build"
            find build/Build/Products -maxdepth 3 -name '*.app' || true
            exit 1
          fi
          # Prove the stamp took before shipping anything. CFBundleVersion was
          # hardcoded to 1 in Info.plist once, which silently discarded the
          # build number CI passes — so the release said 1.0 (1) forever and
          # "which build is on the phone" was unanswerable. Never again: a
          # build that still calls itself 1 does not get released.
          BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")
          echo "CFBundleVersion in the built app: $BUILD_NUMBER"
          if [ "$BUILD_NUMBER" != "${{ github.run_number }}" ]; then
            echo "::error::built app reports CFBundleVersion=$BUILD_NUMBER, expected ${{ github.run_number }} — the stamp did not take"
            exit 1
          fi

          rm -rf payload
          mkdir -p payload/Payload
          cp -R "$APP" payload/Payload/
          (cd payload && ditto -c -k --sequesterRsrc --keepParent Payload ../Dispatch-unsigned.ipa)

          # Verify the artifact rather than trusting that the step succeeded.
          ls -l Dispatch-unsigned.ipa
          shasum -a 256 Dispatch-unsigned.ipa

          # Background refresh fails silently if these did not survive
          # packaging, so they are asserted on the built product rather than
          # only on the source.
          plutil -extract UIBackgroundModes json -o - "$APP/Info.plist"
          plutil -extract BGTaskSchedulerPermittedIdentifiers json -o - "$APP/Info.plist"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dispatch-unsigned-ipa
          path: Dispatch-unsigned.ipa
          if-no-files-found: error

      # A release asset is a bare file at a stable URL. A workflow artifact is
      # wrapped in a second zip and cannot be downloaded from the GitHub mobile
      # app at all.
      - name: Publish to rolling release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=latest
          NOTES="Rolling builds of everything in this repo. The .ipa files are unsigned; sign before installing. The .apk is debug-signed."
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Latest build" --notes "$NOTES" --latest || true
          gh release edit "$TAG" --notes "$NOTES" >/dev/null
          gh release upload "$TAG" Dispatch-unsigned.ipa --clobber

          gh release view "$TAG" --json assets \
            --jq '.assets[] | "\(.name) \(.size) bytes updated \(.updatedAt)"'
